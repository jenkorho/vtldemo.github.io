<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body,
        html,
        div, 
        footer {
            margin: 0;
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            flex-grow: 1;
            box-sizing: border-box;

        }

        header {
            background: linear-gradient(darkblue, blueviolet);
        }

        footer,
        #hiddenfooter {
            background-color: white;
            position: sticky;
            flex-direction: row;
            bottom: 0;
            z-index: 100;
            height: 100px;
            width: 100%;
            padding: 1rem;
            justify-content: center;
        }

        #hiddenfooter {
            z-index: 90;
        }

        #normalfooter {
            background-color: antiquewhite;
            width: 100%;
            height: 300px;
            padding: 2rem;
            box-sizing: border-box;
        }

        video {
            z-index: 100;
        }

        .lay {
            background-image: url("Ulapland_RGB_pysty_PNG.png");
        }

        .amk {
            background-image: url("lapinamk_rgb.png");
        }

        .eu {
            background-image: url("FI_co-funded by VERTICAL RGB_POS.png");
        }

        .lapinliitto {
            background-image: url("lapinliitto_rgb_pysty_vari.png");
        }

        .footer-logo {
            background-size: contain;
            background-repeat: no-repeat;
            align-items: center;
            justify-content: center;
            background-position: center;
            max-width: 250px;
        }

        footer .lay, footer .amk {
            display: none;
        }

        @media screen and (width > 600px){

        footer .lay, footer .amk {
            display: flex;
        }

        #hiddenfooter {
            display: none;
        }
            
        }

    </style>
</head>

<body>
    <header>
        <video autoplay muted style="width: 100%; height: auto; mix-blend-mode: lighten;" src="logo_anim_hd.webm"></video>
    </header>
    <div style="height: 2000px; background-color: blueviolet;">

    </div>
    <div id="normalfooter">
        <h2>Footer budjetti</h2>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Consectetur, amet quibusdam neque nihil reprehenderit
        alias porro. Voluptates optio sequi quis, totam sunt nulla adipisci consequatur sapiente, saepe laborum
        explicabo eius.
    </div>
    <footer>
        <div class="eu footer-logo"></div>
        <div class="lapinliitto footer-logo"></div>
        <div class="amk footer-logo"></div>
        <div class="lay footer-logo"></div>
    </footer>
    <div id="hiddenfooter">
        <div class="amk footer-logo"></div>
        <div class="lay footer-logo"></div>
    </div>
</body>

</html>
